<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flöriva Cosmétiques</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose-pale:   #fce8f0;
      --rose-mid:    #f0c8d8;
      --bordeaux:    #7b2d42;
      --bordeaux-lt: #a04060;
      --petal:       #e8b4c8;
      --white:       #ffffff;
      --text-soft:   #9a7080;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: 'Jost', sans-serif;
      background: linear-gradient(160deg, #fce8f0 0%, #f9d8e8 40%, #f2c4d8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    /* Petal decorations */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 340px; height: 340px;
      background: radial-gradient(circle, var(--bordeaux) 0%, transparent 70%);
      top: -80px; right: -80px;
    }
    body::after {
      width: 260px; height: 260px;
      background: radial-gradient(circle, var(--bordeaux) 0%, transparent 70%);
      bottom: -60px; left: -60px;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* Logo area */
    .logo-wrap {
      margin-bottom: 6px;
    }

    .logo-circle {
      width: 100px;
      height: 100px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 4px 24px rgba(123,45,66,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* SVG logo inline — faithful to uploaded logo */
    .logo-svg {
      width: 78px;
      height: 78px;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--bordeaux);
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .brand-name em {
      font-style: italic;
      font-weight: 400;
    }

    .brand-sub {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      color: var(--bordeaux-lt);
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .flag {
      font-size: 1rem;
      margin-bottom: 28px;
      display: block;
    }

    /* Thin petal divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--petal), transparent);
    }
    .divider-icon {
      font-size: 0.9rem;
      color: var(--bordeaux-lt);
      opacity: 0.7;
    }

    /* Tagline */
    .tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--bordeaux-lt);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Link buttons */
    .links {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 18px;
      border-radius: 50px;
      text-decoration: none;
      background: var(--white);
      border: 1.5px solid rgba(123,45,66,0.12);
      box-shadow: 0 2px 12px rgba(123,45,66,0.08);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      cursor: pointer;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(123,45,66,0.16);
    }
    .link-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(123,45,66,0.1);
    }

    .icon-pill {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-pill svg { width: 20px; height: 20px; }

    .wtsp  .icon-pill { background: #e8f5e9; }
    .insta .icon-pill { background: #fce4ec; }

    .btn-text {
      flex: 1;
      text-align: left;
    }
    .btn-text strong {
      display: block;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--bordeaux);
      letter-spacing: 0.01em;
    }
    .btn-text small {
      display: block;
      font-size: 0.7rem;
      font-weight: 300;
      color: var(--text-soft);
      margin-top: 2px;
    }

    .chevron {
      color: var(--petal);
      font-size: 1.1rem;
      font-weight: 300;
    }

    /* Footer */
    .footer {
      margin-top: 32px;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--bordeaux-lt);
      opacity: 0.5;
    }

    /* Responsive — already fluid, but clamp on very wide */
    @media (min-width: 600px) {
      .card { max-width: 420px; }
      .brand-name { font-size: 2.3rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link-btn { transition: none; }
    }
  </style>
</head>
